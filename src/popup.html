<!DOCTYPE html>
<html class="bs-pj-popup">
<head>
  <meta charset="utf-8">
  <title>Projects</title>
  <link rel="stylesheet" href="projects.css">
  <style>
    html, body { margin: 0; width: 720px; height: 560px; background: #1e1e2e; overflow: hidden; }
    html.bs-pj-popup #bs-pj-backdrop { padding: 0; background: #1e1e2e; backdrop-filter: none; transition: none; }
    html.bs-pj-popup #bs-pj-panel { width: 100%; height: 100%; max-height: none; border: none; border-radius: 0; box-shadow: none; transition: none; opacity: 1; transform: none; }
    #bs-vimium-toast { position: fixed; left: 50%; bottom: 56px; transform: translate(-50%, 6px); z-index: 2147483647; padding: 8px 16px; border: 1px solid #45475a; border-radius: 10px; background: #313244; color: #cdd6f4; font: 13px/1.4 system-ui, sans-serif; pointer-events: none; opacity: 0; transition: opacity 0.15s ease, transform 0.15s ease; }
    #bs-vimium-toast.bs-vimium-toast-visible { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <script src="popup.js"></script>
</body>
</html>
